<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ticket System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="icon" type="image/png" href="/favicon.png">
  </head>

  <body>
    <header class="navbar">
      <a href="/" class="navbar-name">Public Tickets</a>
      <nav class="navbar-links">
        <a href="/">Home</a>
        <a href="/tickets">Tickets</a>

        <div id="unauthed-links" class="auth-links">
          <a href="/login">Login</a>
          <a href="/register">Register</a>
        </div>

        <div id="authed-links" class="auth-links hidden">
          <button id="logout-link">Logout</button>
        </div>
      </nav>
    </header>

    <main class="home-main">
      <h1>Keep every ticket organized, visible, and moving forward.</h1>
      <p>
        Public tickets gives you the ability to raise issues, discuss approaches, and keep
        track of things as you work through it.
      </p>
      <div class="home-links">
        <a class="tickets-link" href="/tickets">Browse tickets</a>
        <a class="account-link" href="/register">Create an account</a>
      </div>
    </main>

    <script src="/js/auth.js"></script>
  </body>
</html>
