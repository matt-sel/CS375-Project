<!DOCTYPE html>
<html lang="en">
  <head>
    <title>New Ticket</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/new-ticket.css">
    <link rel="icon" type="image/png" href="/favicon.png">
  </head>
  <body>
    <header class="navbar">
      <a href="/" class="navbar-name">Public Tickets</a>
      <nav class="navbar-links">
        <a href="/">Home</a>
        <a href="/tickets">Tickets</a>

        <div id="unauthed-links" class="auth-links">
          <a href="/login">Login</a>
          <a href="/register">Register</a>
        </div>

        <div id="authed-links" class="auth-links hidden">
          <button id="logout-link">Logout</button>
        </div>
      </nav>
    </header>
    <main>
      <h1>Submit a Ticket</h1>
      <div id="ticketForm">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="255" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6"></textarea>

        <label for="tagInput">Tags</label>
        <div id="tagInputRow">
          <input type="text" id="tagInput" placeholder="e.g. customer">
          <button type="button" id="addTagButton">Add</button>
        </div>
        <div id="selectedTags"></div>

        <button type="button" id="submitTicketButton">Submit</button>
        <p id="errorMessage"></p>
      </div>
      <div id="ticketConfirmation" style="display: none;">
        <h2>Ticket submitted</h2>
        <p><strong>Title:</strong> <span id="confirmTitle"></span></p>
        <p><strong>Description:</strong> <span id="confirmDescription"></span></p>
        <p><strong>Tags:</strong></p>
        <div id="confirmTags"></div>
        <a href="/tickets" class="back-link">Back to tickets</a>
      </div>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/new-ticket.js"></script>
  </body>
</html>
