<!DOCTYPE html>
<html lang="en">
  <head>
    <title>New Ticket</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/new-ticket.css">
    <link rel="icon" type="image/png" href="/favicon.png">
  </head>
  <body>
    <header class="navbar">
      <a href="/" class="navbar-name">Public Tickets</a>
      <nav class="navbar-links">
        <a href="/">Home</a>
        <a href="/tickets">Tickets</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      </nav>
    </header>
    <main>
      <h1>Submit a Ticket</h1>
      <div id="ticketForm">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="255" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6"></textarea>

        <label for="tags">Tags <span class="hint">(comma separated)</span></label>
        <input type="text" id="tags" name="tags" placeholder="customer, high-severity">

        <button type="button" id="submitTicketButton">Submit</button>
        <p id="errorMessage"></p>
      </div>
    </main>
    <script src="/js/new-ticket.js"></script>
  </body>
</html>
